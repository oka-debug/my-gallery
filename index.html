<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Gallery</title>

<style>
body {
  margin: 0;
  padding: 40px;
  background: #ffffff;
  font-family: sans-serif;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
  max-width: 1200px;
  margin: auto;
}

.item img {
  width: 100%;
  height: auto;
  display: block;
}

.caption {
  margin-top: 10px;
  font-size: 14px;
  line-height: 1.6;
  text-align: center;
}
</style>

</head>

<body>

<div class="gallery">

  <div class="item">
    <img src="./st01.jpg">
    <div class="caption">
      画像1のキャプション
    </div>
  </div>

  <div class="item">
    <img src="./st02.jpg">
    <div class="caption">
      画像2のキャプション
    </div>
  </div>

  <div class="item">
    <img src="./st03.jpg">
    <div class="caption">
      画像3のキャプション
    </div>
  </div>

</div>

</body>
</html>
