<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery</title>

<!-- Bodoni Moda -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..900&display=swap" rel="stylesheet">

<style>

/* ページ全体 */
body {
  margin: 0;
  padding: 40px;
  background: #ffffff;
  font-family: sans-serif;
}

/* ギャラリー */
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
  max-width: 1200px;
  margin: auto;
}

/* 画像 */
.item img {
  width: 100%;
  height: auto;
  display: block;
  cursor: pointer;
}

/* キャプション */
.caption {
  margin-top: 10px;
  font-family: "Bodoni Moda", serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.6;
  text-align: center;
}

/* 拡大表示 */
#lightbox {
  display: none;
  position: fixed;
  z-index: 9999;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.85);
  justify-content: center;
  align-items: center;
  cursor: pointer;
}

/* 拡大画像 */
#lightbox img {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
}

/* スマホ */
@media (max-width: 700px) {

  body {
    padding: 20px;
  }

  .gallery {
    grid-template-columns: 1fr;
    gap: 30px;
  }

}

</style>

</head>

<body>

<div class="gallery">

  <div class="item">
    <img src="st01.jpg" onclick="openLightbox(this.src)">
    <div class="caption">
      st01
    </div>
  </div>

  <div class="item">
    <img src="st02.jpg" onclick="openLightbox(this.src)">
    <div class="caption">
      st02
    </div>
  </div>

  <div class="item">
    <img src="st03.jpg" onclick="openLightbox(this.src)">
    <div class="caption">
      st03
    </div>
  </div>

</div>

<!-- 拡大表示 -->
<div id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img">
</div>

<script>

function openLightbox(src) {
  document.getElementById("lightbox-img").src = src;
  document.getElementById("lightbox").style.display = "flex";
}

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

</script>

</body>

</html>
